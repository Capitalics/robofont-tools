[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robofont-fracturize"
version = "0.1.0.dev0"
description = "Internal RoboFont extension for compatible fractured glyph masters"
requires-python = ">=3.11"
dependencies = [
    "booleanOperations>=0.10,<1",
    "defcon>=0.10,<1",
    "fonttools>=4.55,<5",
    "shapely>=2.1,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["Fracturize.roboFontExt/lib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
