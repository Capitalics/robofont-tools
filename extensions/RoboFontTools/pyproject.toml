[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robofont-tools-extension"
version = "0.4.0"
description = "Drawing, measurement, selection, and point layout utilities for RoboFont"
requires-python = ">=3.12"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["RoboFontTools.roboFontExt/lib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"   # RoboFont 4.6's bundled Python

[tool.ruff.lint]
# Errors only: undefined names, unused imports and variables, syntax errors.
select = ["E9", "F"]
