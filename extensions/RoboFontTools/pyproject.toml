[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robofont-tools-extension"
version = "0.1.0"
description = "Small read-only drawing and measurement utilities for RoboFont"
requires-python = ">=3.12"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["RoboFontTools.roboFontExt/lib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
